<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | [Nombre empresa]</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="hero hero-sm">
    <div><h1>Contacto</h1></div>
  </section>

  <main class="contenedor">
    <div class="grid">
      <form>
        <input name="nombre" placeholder="Nombre" required>
        <input type="email" name="correo" placeholder="Correo" required>
        <textarea name="mensaje" placeholder="Mensaje" rows="4" required></textarea>
        <button class="btn">Enviar</button>
      </form>
      <div>
        <p>Aquí anexa dirección, teléfono, correo y horario.</p>
        <div class="placeholder img-espacio">Espacio para mapa (iframe de Google Maps)</div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
